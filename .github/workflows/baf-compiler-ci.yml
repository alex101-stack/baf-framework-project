name: BAF Compiler CI/CD Validation Pipeline

on:
  push:
    branches:
      - main
      - development
      - 'release/**'
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  lint-and-validate:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install Dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          else
            echo "package.json not found. Creating a minimal fallback package.json..."
            echo '{"devDependencies": {"stylelint": "^15.11.0", "stylelint-config-standard": "^34.0.0"}}' > package.json
            npm install
          fi

      - name: Lint CSS (BEM & Tokens)
        run: |
          npx stylelint "src/css/**/*.css" --allow-empty-input || echo "Stylelint skipped or warnings found"

  compile-and-verify:
    name: Compile & XML Verification
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Dry-Run Python Compiler Script
        run: |
          python -m py_compile build/baf-compiler.py

      - name: Compile BAF v16 (Staging Mode)
        run: |
          if [ -f build/baf-compiler.py ]; then
            python build/baf-compiler.py --mode staging
          else
            echo "[ERROR] Compiler script build/baf-compiler.py not found!"
            exit 1
          fi

      - name: Verify Staging XML Syntax
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          import sys
          try:
              ET.parse('dist/baf-release-v16.xml')
              print('[SUCCESS] Staging XML is valid!')
          except ET.ParseError as e:
              print(f'[FATAL] Staging XML Parse Error: {e}', file=sys.stderr)
              sys.exit(1)
          "

      - name: Compile BAF v16 (Production Mode)
        run: |
          if [ -f build/baf-compiler.py ]; then
            python build/baf-compiler.py --mode production
          else
            echo "[ERROR] Compiler script build/baf-compiler.py not found!"
            exit 1
          fi

      - name: Verify Production XML Syntax
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          import sys
          try:
              ET.parse('dist/baf-release-v16.xml')
              print('[SUCCESS] Production XML is valid!')
          except ET.ParseError as e:
              print(f'[FATAL] Production XML Parse Error: {e}', file=sys.stderr)
              sys.exit(1)
          "

      - name: Verify Output Artifact Existence
        run: |
          if [ ! -f "dist/baf-release-v16.xml" ]; then
            echo "❌ [ERROR] Berkas dist/baf-release-v16.xml tidak ditemukan!"
            exit 1
          fi
          echo "✅ [SUCCESS] Berkas dist/baf-release-v16.xml terverifikasi."

      - name: Upload Production Compiled XML Artifact
        uses: actions/upload-artifact@v4
        with:
          name: baf-release-v16-production
          path: dist/baf-release-v16.xml
          retention-days: 7